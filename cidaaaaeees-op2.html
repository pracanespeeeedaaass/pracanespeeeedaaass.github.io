        async function initPlayer() {
            var id = getParameterByName('id');
            var config = ConfiguracionCanales[id];

            if (!config) {
                console.error("Canal no encontrado en la configuración.");
                return;
            }

            const token = await obtenerTokenServidor();
            if (!token) {
                console.error("No se pudo obtener/desencriptar el token.");
                return;
            }

            var sources = [];
            if (config.k1 && config.k2) {
                sources.push({
                    file: "https://ciades.providers.com.ar/" + id + "/index.mpd?token=" + token + "&dvr_window_length=30",
                    drm: { "clearkey": { "keyId": config.k1, "key": config.k2 } }
                });
            }

            const player = jwplayer("player");
            player.setup({
                playlist: [{
                    title: "REPRODUCTOR",
                    description: "EN VIVO",
                    sources: sources
                }],
                   width: "100%",
                    height: "100%",
                    aspectratio: "16:9",
                    volume:100,
                    mute: "false",
                    stretching: "exactfit",
                    autostart: false,
                    preload: "auto",
                    liveSyncDuration: 3,
            });

            function seleccionarEspañol() {
                const tracks = player.getAudioTracks();
                if (!tracks.length) return;

                const index = tracks.findIndex(track =>
                    /^(es|spa)$|español|castellano|spanish/i.test(
                        track.language || track.name || track.label || ""
                    )
                );

                if (index >= 0 && player.getCurrentAudioTrack() !== index) {
                    player.off("audioTracks", seleccionarEspañol);
                    player.setCurrentAudioTrack(index);
                }
            }

            player.on("audioTracks", seleccionarEspañol);

            // -------------------------------------------------------------
            // Detección exclusiva para móviles y tablets (iPad / Android)
            // Excluye computadoras de escritorio, notebooks, Smart TVs y TV Box
            // -------------------------------------------------------------
            function esDispositivoMovilOTablet() {
                var ua = navigator.userAgent || navigator.vendor || window.opera;

                // 1. Descartar Smart TV, TV Box y Consolas
                var esTV = /TV|SmartTV|AppleTV|GoogleTV|HbbTV|NetCast|WebOS|InettvBrowser|Roku|Vizio|AFTT|AFTM|MIBOX|Chromecast|Android TV|PlayStation|Xbox/i.test(ua);
                if (esTV) return false;

                // 2. Detectar smartphones y tablets por User Agent
                var esMovilTabletUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);

                // 3. Detectar iPads con iPadOS moderno (que se identifican como MacIntel con pantalla táctil multitáctil)
                var esIPadOS = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

                return esMovilTabletUA || esIPadOS;
            }

            // Giro automático a orientación horizontal solo al activar Fullscreen
            player.on("fullscreen", function(e) {
                if (esDispositivoMovilOTablet()) {
                    if (e.fullscreen) {
                        if (screen.orientation && typeof screen.orientation.lock === "function") {
                            screen.orientation.lock("landscape").catch(function(err) {
                                console.log("Giro horizontal no soportado o bloqueado por el navegador:", err);
                            });
                        }
                    } else {
                        if (screen.orientation && typeof screen.orientation.unlock === "function") {
                            screen.orientation.unlock();
                        }
                    }
                }
            });
        }

        document.addEventListener("DOMContentLoaded", initPlayer);
    </script>
