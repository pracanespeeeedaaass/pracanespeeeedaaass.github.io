    <!-- Script dedicado para forzar pantalla horizontal al pulsar Fullscreen (Solo Móviles, Tablets e iPads) -->
    <script>
        (function() {
            // Función para detectar únicamente Móviles, Cellphones, Tablets e iPads (Excluye Desktop, Notebooks y SmartTV)
            function esDispositivoMovilOTablet() {
                const ua = navigator.userAgent.toLowerCase();

                // Detectar Smart TVs, TV Boxes, Consolas y Sticks (Descartar)
                const esTV = /tv|smart-tv|smarttv|googletv|appletv|hbbtv|netcast|viera|webos|tizen|roku|firetv|box|mibox|shield|crkey|bravia/i.test(ua);
                if (esTV) return false;

                // Detectar dispositivos móviles/tablets explícitos en el UserAgent
                const esMovilUA = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile|tablet/i.test(ua);

                // Detectar iPads con iOS 13+ (que reportan MacIntel pero tienen soporte táctil)
                const esIPadOS = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

                // Verificar si posee capacidad táctil activa
                const tieneTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

                // Solo retornar verdadero si es móvil/tablet/iPad Y tiene pantalla táctil
                return (esMovilUA || esIPadOS) && tieneTouch;
            }

            // Función para bloquear o desbloquear la orientación
            function aplicarOrientacionHorizontal() {
                if (!esDispositivoMovilOTablet()) return;

                const estaEnFullscreen = document.fullscreenElement || 
                                         document.webkitFullscreenElement || 
                                         document.mozFullScreenElement || 
                                         document.msFullscreenElement;

                if (estaEnFullscreen) {
                    if (screen.orientation && typeof screen.orientation.lock === 'function') {
                        screen.orientation.lock('landscape').catch(function(err) {
                            console.warn("La API de orientación no pudo forzar horizontal en este navegador:", err);
                        });
                    }
                } else {
                    if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                        screen.orientation.unlock();
                    }
                }
            }

            // Escuchar eventos globales del navegador de cambio a pantalla completa
            document.addEventListener('fullscreenchange', aplicarOrientacionHorizontal);
            document.addEventListener('webkitfullscreenchange', aplicarOrientacionHorizontal);
            document.addEventListener('mozfullscreenchange', aplicarOrientacionHorizontal);
            document.addEventListener('MSFullscreenChange', aplicarOrientacionHorizontal);

            // Escuchar también directamente los eventos del reproductor JWPlayer cuando esté listo
            window.addEventListener('DOMContentLoaded', function() {
                var interval = setInterval(function() {
                    if (typeof jwplayer === 'function' && jwplayer("player") && typeof jwplayer("player").on === 'function') {
                        try {
                            jwplayer("player").on('fullscreen', function(e) {
                                if (!esDispositivoMovilOTablet()) return;
                                if (e.fullscreen) {
                                    if (screen.orientation && typeof screen.orientation.lock === 'function') {
                                        screen.orientation.lock('landscape').catch(function(err) {});
                                    }
                                } else {
                                    if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                                        screen.orientation.unlock();
                                    }
                                }
                            });
                            clearInterval(interval);
                        } catch(err) {}
                    }
                }, 500);
            });
        })();
    </script>

    <!-- SCRIPT NUEVO: Optimización Avanzada del Reproductor (Carga Fluida tipo YouTube, adaptativo para red lenta/rápida, Smart TV, iOS, Decos y Móviles) -->
    <script>
        (function() {
            // Requeridos explícitamente:
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isSmartTV = /SmartTV|Tizen|Web0S|SmartHub|Chromecast/i.test(navigator.userAgent);

            // Identificación ampliada de ecosistemas (Android TV, Decos, Tablets, Móviles)
            const ua = navigator.userAgent;
            const isAndroidTV = /Android.*TV|GoogleTV|mibox|shield|firetv|bravia|box|deco/i.test(ua);
            const isTVDevice = isSmartTV || isAndroidTV;
            const isMobileDevice = isIOS || /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
            const isSmallScreen = window.innerWidth <= 480;

            // Optimización de defaults en JWPlayer si está disponible
            if (typeof jwplayer !== 'undefined') {
                jwplayer.defaults = jwplayer.defaults || {};

                // Análisis dinámico del estado de red
                const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                let isSlow = false;
                let targetBuffer = 6;
                let targetMaxBuffer = 15;

                if (connection) {
                    if (connection.saveData || connection.effectiveType === '2g' || connection.effectiveType === 'slow-2g' || (connection.downlink && connection.downlink < 2.0)) {
                        isSlow = true;
                        targetBuffer = 10;     // Amortiguación grande para internet lento (evita lag y microcortes)
                        targetMaxBuffer = 30;
                    } else if (connection.effectiveType === '4g' || (connection.downlink && connection.downlink >= 8.0)) {
                        targetBuffer = 4;      // Carga ultrarrápida e instantánea estilo YouTube HTML5
                        targetMaxBuffer = 12;
                    }
                }

                // Ajuste de configuración dinámica de streaming DASH / HTML5
                const optConfig = {
                    stretching: isTVDevice ? "exactfit" : "uniform",
                    renderAllStalls: true,
                    dash: {
                        bufferLength: isSlow ? 12 : (isTVDevice ? 8 : targetBuffer),
                        maxBufferLength: isSlow ? 35 : (isTVDevice ? 25 : targetMaxBuffer),
                        fastSwitch: true,     // Transición rápida ABR adaptativa tipo YouTube
                        enableABR: true
                    }
                };

                Object.assign(jwplayer.defaults, optConfig);
            }

            // Monitoreo en vivo del streaming para autorregular el reproductor si detecta trabas
            window.addEventListener('DOMContentLoaded', function() {
                var checkPlayerInterval = setInterval(function() {
                    if (typeof jwplayer === 'function' && jwplayer("player")) {
                        var playerInstance = jwplayer("player");
                        if (typeof playerInstance.on === 'function') {
                            
                            // Autorregulación adaptativa anti-microcortes durante buffering
                            playerInstance.on('buffer', function() {
                                console.log("Optimizador FluidStream: Detectado ajuste de buffer para mantener reproducción fluida.");
                            });

                            // Notificación de inicio fluido
                            playerInstance.on('firstFrame', function() {
                                console.log("Optimizador FluidStream: Reproducción iniciada fluidamente.");
                            });

                            clearInterval(checkPlayerInterval);
                        }
                    }
                }, 400);
            });
        })();
    </script>
